# VirtualHost Configuration for api.mastrotickets.co
# Hostinger Ubuntu VPS with Apache 2.4+ and PHP-FPM / mod_php

<VirtualHost *:80>
    ServerName api.mastrotickets.co
    DocumentRoot /var/www/mastrotickets/backend/public

    # Force HTTPS redirect
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName api.mastrotickets.co
    DocumentRoot /var/www/mastrotickets/backend/public

    # SSL Configuration (Certbot / Let's Encrypt paths)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/api.mastrotickets.co/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.mastrotickets.co/privkey.pem

    # Security Headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    <Directory /var/www/mastrotickets/backend/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Pass Bearer authorization token to PHP
        SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
    </Directory>

    # Protect parent files (.env, composer.json, database, src) from direct HTTP access
    <Directory /var/www/mastrotickets/backend>
        Require all denied
    </Directory>
    <Directory /var/www/mastrotickets/backend/public>
        Require all granted
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/mastrotickets_api_error.log
    CustomLog ${APACHE_LOG_DIR}/mastrotickets_api_access.log combined
</VirtualHost>
